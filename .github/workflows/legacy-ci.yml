name: Legacy .NET Framework CI

on:
  push:
    branches: [ "main", "feature/*", "feat/*" ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-ci.yml'

jobs:
  build-and-test-legacy:
    name: Build & Test Legacy .NET Framework 4.8 MVC 5
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: dotnet restore legacy/StockFlow.Legacy.sln

    - name: Build legacy solution with MSBuild
      run: msbuild legacy/StockFlow.Legacy.sln /p:Configuration=Release

    - name: Execute legacy unit tests
      run: dotnet test legacy/StockFlow.Legacy.sln --configuration Release --no-build --verbosity normal
